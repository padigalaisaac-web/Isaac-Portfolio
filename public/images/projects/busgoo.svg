<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" rx="16" />
  
  <!-- Subtle Grid -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- App Window -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(37,99,235,0.07))" />

  <!-- Header -->
  <rect x="60" y="50" width="680" height="46" rx="14" fill="#F8FAFC" />
  <circle cx="90" cy="73" r="5" fill="#EF4444" />
  <circle cx="106" cy="73" r="5" fill="#F59E0B" />
  <circle cx="122" cy="73" r="5" fill="#10B981" />
  <text x="400" y="78" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BusGoo • Smart Bus Booking Platform (React + Supabase)</text>

  <!-- Search Bar Row -->
  <rect x="90" y="115" width="620" height="55" rx="10" fill="#F1F5F9" stroke="#E2E8F0" />
  <rect x="105" y="125" width="135" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="120" y="147" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" font-weight="500">From: Hyderabad</text>

  <rect x="250" y="125" width="135" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="265" y="147" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" font-weight="500">To: Bengaluru</text>

  <rect x="395" y="125" width="135" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="410" y="147" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Date: Tomorrow</text>

  <rect x="545" y="125" width="145" height="35" rx="6" fill="#2563EB" />
  <text x="617" y="147" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Search Buses</text>

  <!-- Left: Bus Cards -->
  <rect x="90" y="185" width="370" height="110" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <text x="110" y="215" fill="#0F172A" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Royal Travels Express AC</text>
  <text x="110" y="235" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">21:30 Hyd ➔ 06:00 Blr (8h 30m)</text>
  <text x="110" y="275" fill="#2563EB" font-family="system-ui, sans-serif" font-size="18" font-weight="700">₹899</text>
  <rect x="345" y="250" width="100" height="32" rx="6" fill="#2563EB" />
  <text x="395" y="271" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Selected</text>

  <rect x="90" y="305" width="370" height="105" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="110" y="335" fill="#0F172A" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Super Fast Sleeper Luxury</text>
  <text x="110" y="355" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">22:00 Hyd ➔ 06:45 Blr (8h 45m)</text>
  <text x="110" y="390" fill="#1E293B" font-family="system-ui, sans-serif" font-size="16" font-weight="700">₹1,150</text>
  <rect x="345" y="365" width="100" height="32" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
  <text x="395" y="386" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">View Seats</text>

  <!-- Right: Seat Selector Mockup -->
  <rect x="480" y="185" width="230" height="225" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="500" y="215" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Interactive Seat Layout</text>
  
  <!-- Driver Seat -->
  <circle cx="680" cy="210" r="10" fill="#E2E8F0" />
  <text x="680" y="214" font-size="9" fill="#64748B" text-anchor="middle">🚗</text>

  <!-- Grid of seats -->
  <!-- Row 1 -->
  <rect x="500" y="235" width="28" height="28" rx="4" fill="#2563EB" />
  <text x="514" y="253" font-size="10" fill="#FFF" font-weight="600" text-anchor="middle">01</text>
  <rect x="535" y="235" width="28" height="28" rx="4" fill="#CBD5E1" />
  <rect x="630" y="235" width="28" height="28" rx="4" fill="#E2E8F0" stroke="#CBD5E1" />
  <rect x="665" y="235" width="28" height="28" rx="4" fill="#E2E8F0" stroke="#CBD5E1" />

  <!-- Row 2 -->
  <rect x="500" y="275" width="28" height="28" rx="4" fill="#E2E8F0" stroke="#CBD5E1" />
  <rect x="535" y="275" width="28" height="28" rx="4" fill="#2563EB" />
  <text x="549" y="293" font-size="10" fill="#FFF" font-weight="600" text-anchor="middle">06</text>
  <rect x="630" y="275" width="28" height="28" rx="4" fill="#CBD5E1" />
  <rect x="665" y="275" width="28" height="28" rx="4" fill="#E2E8F0" stroke="#CBD5E1" />

  <!-- Supabase sync badge -->
  <rect x="500" y="350" width="190" height="36" rx="6" fill="#ECFDF5" stroke="#A7F3D0" />
  <text x="595" y="373" fill="#065F46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Supabase Realtime Sync</text>
</svg>
