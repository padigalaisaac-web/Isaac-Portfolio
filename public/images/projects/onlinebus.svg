<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg4)" rx="16" />
  
  <!-- Subtle Grid -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- App Window -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(37,99,235,0.07))" />

  <!-- Header -->
  <rect x="60" y="50" width="680" height="46" rx="14" fill="#F8FAFC" />
  <circle cx="90" cy="73" r="5" fill="#EF4444" />
  <circle cx="106" cy="73" r="5" fill="#F59E0B" />
  <circle cx="122" cy="73" r="5" fill="#10B981" />
  <text x="400" y="78" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Online Bus Portal • PHP &amp; MySQL Relational Booking Engine</text>

  <!-- Left Form -->
  <rect x="90" y="115" width="290" height="295" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="110" y="145" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Passenger Ticket Booking</text>
  
  <text x="110" y="175" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Select Route &amp; Schedule</text>
  <rect x="110" y="185" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="125" y="206" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12">Hyd (MGBS) ➔ Vijayawada</text>

  <text x="110" y="240" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Select Bus Category</text>
  <rect x="110" y="250" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="125" y="271" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12">Super Luxury (2+2 Push Back)</text>

  <text x="110" y="305" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Seat Selection</text>
  <rect x="110" y="315" width="250" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="125" y="336" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12">Seat #14 (Window, Upper Deck)</text>

  <rect x="110" y="360" width="250" height="36" rx="6" fill="#2563EB" />
  <text x="235" y="383" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Confirm &amp; Generate PNR</text>

  <!-- Right: MySQL Schema & Query Log -->
  <rect x="400" y="115" width="310" height="295" rx="10" fill="#0F172A" />
  <rect x="400" y="115" width="310" height="32" rx="10" fill="#1E293B" />
  <circle cx="420" cy="131" r="4" fill="#EF4444" />
  <circle cx="432" cy="131" r="4" fill="#F59E0B" />
  <circle cx="444" cy="131" r="4" fill="#10B981" />
  <text x="460" y="135" fill="#94A3B8" font-family="monospace" font-size="10">mysql -u root -p bus_reservation</text>

  <text x="420" y="175" fill="#38BDF8" font-family="monospace" font-size="11">SELECT r.route_name, s.departure_time,</text>
  <text x="420" y="195" fill="#38BDF8" font-family="monospace" font-size="11">&nbsp;&nbsp;b.available_seats, t.fare</text>
  <text x="420" y="215" fill="#38BDF8" font-family="monospace" font-size="11">FROM schedules s</text>
  <text x="420" y="235" fill="#38BDF8" font-family="monospace" font-size="11">JOIN routes r ON s.route_id = r.id</text>
  <text x="420" y="255" fill="#38BDF8" font-family="monospace" font-size="11">WHERE s.status = 'ACTIVE';</text>

  <rect x="420" y="275" width="270" height="1" fill="#334155" />

  <text x="420" y="305" fill="#4ADE80" font-family="monospace" font-size="11">✓ Connection: PDO MySQL (utf8mb4)</text>
  <text x="420" y="330" fill="#4ADE80" font-family="monospace" font-size="11">✓ Transaction committed successfully</text>
  <text x="420" y="355" fill="#94A3B8" font-family="monospace" font-size="11">PNR generated: <tspan fill="#FACC15">TS-2024-8904</tspan></text>
  <text x="420" y="380" fill="#94A3B8" font-family="monospace" font-size="11">Row locked with FOR UPDATE</text>
</svg>
