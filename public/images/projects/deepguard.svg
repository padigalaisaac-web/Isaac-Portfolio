<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- App Window Card -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(37,99,235,0.07))" />

  <!-- Window Header -->
  <rect x="60" y="50" width="680" height="46" rx="14" fill="#F8FAFC" />
  <circle cx="90" cy="73" r="5" fill="#EF4444" />
  <circle cx="106" cy="73" r="5" fill="#F59E0B" />
  <circle cx="122" cy="73" r="5" fill="#10B981" />
  <text x="400" y="78" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">DeepGuard AI • Video Authenticity &amp; Deepfake Analysis Engine</text>

  <!-- Left Panel: Face Scan / OpenCV Wireframe -->
  <rect x="90" y="120" width="280" height="290" rx="10" fill="#F1F5F9" stroke="#E2E8F0" />
  <circle cx="230" cy="230" r="75" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="230" cy="230" r="55" fill="none" stroke="#60A5FA" stroke-width="1.5" />
  
  <!-- Face Landmarks -->
  <circle cx="210" cy="215" r="4" fill="#2563EB" />
  <circle cx="250" cy="215" r="4" fill="#2563EB" />
  <path d="M225 240 L235 240" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
  <path d="M215 260 Q230 272 245 260" stroke="#2563EB" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Target Reticle Box -->
  <path d="M 145 155 L 170 155 M 145 155 L 145 180" stroke="#2563EB" stroke-width="3" fill="none" />
  <path d="M 315 155 L 290 155 M 315 155 L 315 180" stroke="#2563EB" stroke-width="3" fill="none" />
  <path d="M 145 375 L 170 375 M 145 375 L 145 350" stroke="#2563EB" stroke-width="3" fill="none" />
  <path d="M 315 375 L 290 375 M 315 375 L 315 350" stroke="#2563EB" stroke-width="3" fill="none" />

  <rect x="130" y="325" width="200" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="230" y="341" fill="#1E293B" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">ANALYZING: FRAME 0842/1200</text>

  <!-- Right Panel: Analytics & FastApi Score -->
  <rect x="400" y="120" width="310" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="420" y="148" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Authenticity Confidence</text>
  <text x="420" y="185" fill="#10B981" font-family="system-ui, sans-serif" font-size="30" font-weight="700">98.4% Real</text>
  <rect x="620" y="145" width="70" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" />
  <text x="655" y="161" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">VERIFIED</text>

  <!-- Frequency Domain & Artifact Detection Card -->
  <rect x="400" y="225" width="310" height="185" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="420" y="252" fill="#1E293B" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Model Pipeline Metrics</text>
  
  <!-- Metric Bars -->
  <text x="420" y="282" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Facial Landmark Jitter</text>
  <rect x="420" y="290" width="270" height="7" rx="3.5" fill="#E2E8F0" />
  <rect x="420" y="290" width="32" height="7" rx="3.5" fill="#10B981" />

  <text x="420" y="322" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Blink Frequency Variance</text>
  <rect x="420" y="330" width="270" height="7" rx="3.5" fill="#E2E8F0" />
  <rect x="420" y="330" width="24" height="7" rx="3.5" fill="#10B981" />

  <text x="420" y="362" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">FastAPI Inference Latency: 42ms</text>
  <rect x="420" y="370" width="270" height="7" rx="3.5" fill="#E2E8F0" />
  <rect x="420" y="370" width="230" height="7" rx="3.5" fill="#2563EB" />
</svg>
