<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)" rx="16" />
  
  <!-- Subtle Grid -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- App Window -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(37,99,235,0.07))" />

  <!-- Header -->
  <rect x="60" y="50" width="680" height="46" rx="14" fill="#F8FAFC" />
  <circle cx="90" cy="73" r="5" fill="#EF4444" />
  <circle cx="106" cy="73" r="5" fill="#F59E0B" />
  <circle cx="122" cy="73" r="5" fill="#10B981" />
  <text x="400" y="78" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">n8n Workflow • AI Autonomous Video Generation &amp; Distribution</text>

  <!-- Canvas nodes and connectors -->
  <!-- Connection Lines with Animated Dash style -->
  <path d="M 190 230 L 290 230" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 430 230 L 520 180" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4" />
  <path d="M 430 230 L 520 300" stroke="#EF4444" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Node 1: Webhook / Form Input -->
  <rect x="90" y="180" width="100" height="100" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))" />
  <rect x="105" y="195" width="70" height="24" rx="4" fill="#EFF6FF" />
  <text x="140" y="211" fill="#2563EB" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INPUT</text>
  <text x="140" y="245" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Form Trigger</text>
  <text x="140" y="263" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Prompt &amp; Audio</text>

  <!-- Node 2: AI Video Processor Engine -->
  <rect x="290" y="165" width="140" height="130" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))" />
  <rect x="305" y="180" width="110" height="24" rx="4" fill="#DBEAFE" />
  <text x="360" y="196" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI SYNTHESIS</text>
  <text x="360" y="228" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Video Engine</text>
  <text x="360" y="248" fill="#64748B" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">CapCut / FFmpeg API</text>
  <rect x="315" y="262" width="90" height="18" rx="9" fill="#ECFDF5" />
  <text x="360" y="275" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Rendered 1080p</text>

  <!-- Node 3: Instagram Publishing -->
  <rect x="520" y="130" width="170" height="100" rx="12" fill="#FFFFFF" stroke="#E1306C" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))" />
  <rect x="535" y="145" width="140" height="24" rx="4" fill="#FDF2F8" />
  <text x="605" y="161" fill="#BE185D" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INSTAGRAM REELS</text>
  <text x="605" y="195" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Graph API Publisher</text>
  <text x="605" y="213" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">✓ Published with Tags</text>

  <!-- Node 4: YouTube Shorts Publishing -->
  <rect x="520" y="250" width="170" height="100" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))" />
  <rect x="535" y="265" width="140" height="24" rx="4" fill="#FEF2F2" />
  <text x="605" y="281" fill="#B91C1C" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">YOUTUBE SHORTS</text>
  <text x="605" y="315" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Data API v3 Auto-Upload</text>
  <text x="605" y="333" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">✓ Uploaded &amp; Monetized</text>

  <!-- Bottom Log Bar -->
  <rect x="90" y="370" width="600" height="45" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
  <circle cx="115" cy="392" r="5" fill="#10B981" />
  <text x="130" y="396" fill="#1E293B" font-family="monospace" font-size="11">Workflow Status: Executed in 18.4s • Zero-drop webhook listener active</text>
</svg>
