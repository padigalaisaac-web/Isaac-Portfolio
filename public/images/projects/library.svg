<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)" rx="16" />
  
  <!-- Subtle Grid -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- App Window -->
  <rect x="60" y="50" width="680" height="400" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(37,99,235,0.07))" />

  <!-- Header -->
  <rect x="60" y="50" width="680" height="46" rx="14" fill="#F8FAFC" />
  <circle cx="90" cy="73" r="5" fill="#EF4444" />
  <circle cx="106" cy="73" r="5" fill="#F59E0B" />
  <circle cx="122" cy="73" r="5" fill="#10B981" />
  <text x="400" y="78" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LMS • Library Management System Dashboard (MERN Stack)</text>

  <!-- Stat Cards Row -->
  <rect x="90" y="115" width="145" height="75" rx="8" fill="#EFF6FF" stroke="#BFDBFE" />
  <text x="105" y="140" fill="#1E40AF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TOTAL BOOKS</text>
  <text x="105" y="172" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="22" font-weight="700">4,820</text>

  <rect x="250" y="115" width="145" height="75" rx="8" fill="#ECFDF5" stroke="#A7F3D0" />
  <text x="265" y="140" fill="#065F46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTIVE ISSUED</text>
  <text x="265" y="172" fill="#064E3B" font-family="system-ui, sans-serif" font-size="22" font-weight="700">312</text>

  <rect x="410" y="115" width="145" height="75" rx="8" fill="#FEF3C7" stroke="#FDE68A" />
  <text x="425" y="140" fill="#92400E" font-family="system-ui, sans-serif" font-size="11" font-weight="600">OVERDUE</text>
  <text x="425" y="172" fill="#78350F" font-family="system-ui, sans-serif" font-size="22" font-weight="700">14</text>

  <rect x="570" y="115" width="140" height="75" rx="8" fill="#F3E8FF" stroke="#E9D5FF" />
  <text x="585" y="140" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MEMBERS</text>
  <text x="585" y="172" fill="#581C87" font-family="system-ui, sans-serif" font-size="22" font-weight="700">1,240</text>

  <!-- Table of Transactions -->
  <rect x="90" y="210" width="620" height="200" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="110" y="238" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Recent Book Issue &amp; Return Transactions</text>

  <!-- Table Headers -->
  <rect x="110" y="255" width="580" height="30" rx="4" fill="#E2E8F0" />
  <text x="125" y="275" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BOOK TITLE</text>
  <text x="320" y="275" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MEMBER ID</text>
  <text x="460" y="275" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ISSUE DATE</text>
  <text x="590" y="275" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">STATUS</text>

  <!-- Row 1 -->
  <text x="125" y="315" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Introduction to Algorithms (CLRS)</text>
  <text x="320" y="315" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">CS-2024-082</text>
  <text x="460" y="315" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">12 Nov 2024</text>
  <rect x="580" y="300" width="70" height="22" rx="11" fill="#DCFCE7" />
  <text x="615" y="315" fill="#15803D" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ISSUED</text>

  <!-- Row 2 -->
  <line x1="110" y1="335" x2="690" y2="335" stroke="#E2E8F0" stroke-width="1" />
  <text x="125" y="360" fill="#1E293B" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Deep Learning with Python</text>
  <text x="320" y="360" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">AIML-2024-019</text>
  <text x="460" y="360" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">08 Nov 2024</text>
  <rect x="580" y="345" width="70" height="22" rx="11" fill="#DBEAFE" />
  <text x="615" y="360" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RETURNED</text>
</svg>
